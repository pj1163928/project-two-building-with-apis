[project]
name = "project-two-building-with-apis"
version = "0.1.0"
description = "Game asset collection and management center (CIDM 3312 Project 2)"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.2",
    "django-htmx>=1.29.0",
    "django-tailwind-cli>=4.8.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "responses>=0.26.3",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
# Markdown is excluded so docs keep their hand-wrapped code samples.
extend-exclude = ["prototypes", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E", "W", "I", "UP"]
