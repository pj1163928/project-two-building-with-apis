{# One entry in the scroll ruler's section index (base.html): a plain #anchor to `target`, #}
{# named `label` (shown on hover or focus). Its number is a CSS counter, in page order.    #}
<li><a href="#{{ target }}" class="scroll-ruler-link" data-ruler-target="{{ target }}"><span class="scroll-ruler-label">{{ label }}</span><span class="scroll-ruler-number" aria-hidden="true"></span><span class="scroll-ruler-tick" aria-hidden="true"></span></a></li>
