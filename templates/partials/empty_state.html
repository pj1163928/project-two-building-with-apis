{# A ghost-mark empty state on a solid, bordered surface. Include with title, body, and optional link_url / link_text. #}
<div class="empty-state relative overflow-hidden bg-surface border border-line-strong px-10 py-16 text-center">
  <i class="mark absolute -right-6 -bottom-10 w-48 text-ink opacity-[.03]" aria-hidden="true"></i>
  <i class="mark w-8 text-fg-muted" aria-hidden="true"></i>
  <p class="mt-3 text-fg-strong font-medium">{{ title }}</p>
  {% if body %}<p class="text-sm text-fg-weak mt-1">{{ body }}</p>{% endif %}
  {% if link_url %}<a href="{{ link_url }}" class="btn btn-quiet btn-sm mt-5">{{ link_text }}</a>{% endif %}
</div>
