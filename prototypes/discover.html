  .act { position: relative; color: #858585; transition: color .15s; }

  .act.on { color: #ffffff; }
  .act.on::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: #fff; }

  .etab { border-top: 2px solid transparent; color: #8b8b8b; background: #181818; }
  .etab:hover { color: #ddd; }
  .etab.on { border-top-color: var(--tc); color: #fff; background: #1e1e1e; }

           box-shadow: 0 10px 30px -12px color-mix(in srgb, var(--tc) 55%, transparent); }

];
const PROV = {

const S = {
  v: "ABC".includes(location.hash.slice(1)) && location.hash.length === 2 ? "ABC".indexOf(location.hash.slice(1)) : Number(localStorage.getItem("ax-proto-variant") || 0),
  type: "textures",

  sections: {},

  panel: [true, false, true],
  sel: null,
  playing: null,
  collapsed: {},
  token: 0,

const T = () => TYPES.find(t => t.key === S.type);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mb = b => b ? (b > 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(1) + " MB") : "";
const mss = ms => ms ? `${Math.floor(ms / 60000)}:${String(Math.round(ms / 1000) % 60).padStart(2, "0")}` : "?";

/* ---------------- search simulation (stands in for one HTMX request per provider) ---------------- */
function runSearch() {
  const tok = ++S.token;
  S.sel = null;
  for (const p of T().providers) {
    S.sections[p] = { status: "loading", items: [] };
    const d = PROV[p].delay * (S.sim.slow ? 3 : 1);
    setTimeout(() => {
      if (tok !== S.token) return;
      S.sections[p] = resolve(p);
      if (S.v === 2 && !S.sel) { const first = firstItem(); if (first) S.sel = first; }
      render();
    }, d);
  }
  render();
}
function resolve(p) {
  if (p === "polyhaven" && S.sim.failPH)
    return { status: "error", msg: "Could not connect to Poly Haven. Check your internet connection, or try again in a minute." };

  if (p === "ambientcg" && S.sim.emptyACG) items = [];

  if (q && q !== block.q) {
    const words = q.split(/\s+/);
    items = items.filter(it => words.some(w => (it.name + " " + it.tags.join(" ")).toLowerCase().includes(w)));
  }

    model:   '<path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="m3 7 9 5 9-5M12 12v10"/>',

}
function wave(id, w = 120, h = 40, bars = 28) {
  let x = 0; for (const ch of id) x = (x * 31 + ch.charCodeAt(0)) >>> 0;
  let out = ""; const bw = w / bars;
  for (let i = 0; i < bars; i++) {
    x = (x * 1103515245 + 12345) >>> 0;
    const bh = Math.max(3, ((x >>> 16) % 100) / 100 * h * (0.4 + 0.6 * Math.sin(Math.PI * i / bars)));
    out += `<rect x="${i * bw + 1}" y="${(h - bh) / 2}" width="${bw - 2}" height="${bh}" rx="1" fill="currentColor" style="animation-delay:${(i % 7) * 70}ms"/>`;
  }

}

    <div class="px-3 space-y-2 pb-2">${searchForm()}
      <div class="flex gap-1">${TYPES.map(x => `<button onclick="setType('${x.key}')" style="--tc:${x.c}" title="${x.label}"
        class="flex-1 h-7 rounded flex items-center justify-center gap-1 text-[11.5px] border ${x.key === S.type ? "tc-bg tc border-[color:var(--tc)]" : "border-[#333] opacity-60 hover:opacity-100"}">${icon(x.kind, 13)}${x.label}</button>`).join("")}</div>
      <div class="text-[11px] opacity-45">${allItems().length} results · ↑/↓ to move</div></div>
    <div class="flex-1 overflow-auto pb-2">${t.providers.map(rows).join("")}</div>`;
  const it = S.sel;
  const main = !it ? `<div class="flex-1 grid place-items-center grid-bg"><div class="text-center space-y-3 opacity-60">
      <div class="tc inline-block">${icon(t.kind, 48)}</div><div class="text-sm">Select a result to preview it.</div>
      <div class="micro opacity-60">↑ / ↓ to move · Enter to save</div></div></div>`
    : `<div class="h-9 shrink-0 flex items-center gap-2 px-4 border-b hair bg-[#181818]"><span class="tc">${icon(it.kind, 14)}</span><span class="text-[13px] text-white">${esc(it.name)}</span><span class="mono text-[11px] opacity-40">${esc(it.id)}</span></div>
      <div class="flex-1 overflow-auto"><div class="max-w-5xl mx-auto p-8 grid lg:grid-cols-[minmax(0,1fr)_320px] gap-8 fade" style="--tc:${t.c}">
        <div class="rounded-xl overflow-hidden border hair bg-[#151515] ${it.kind === "sound" ? "h-64" : "aspect-square"}">${it.kind === "sound"
          ? `<div class="w-full h-full grid place-items-center tc-bg tc p-8 ${S.playing === it.id ? "playing" : ""}">${wave(it.id, 400, 120, 64)}</div>`
          : `<img src="${esc(it.thumb.replace("256", "512").replace("width=256&height=256", "width=640&height=640"))}" data-kind="${it.kind}" onerror="imgFail(this)" class="w-full h-full object-cover">`}</div>
        <div class="space-y-5">
          <div>${typeBadge(it)}<h2 class="mt-2 text-2xl font-bold text-white leading-tight">${esc(it.name)}</h2>
            <div class="mono text-[11.5px] opacity-45 mt-1">${PROV[it.provider].name} · ${esc(it.id)}</div></div>
          <div class="flex gap-2">${saveBtn(it, "btn-md flex-1")}${it.kind === "sound" ? `<button class="btn btn-md tc-bg tc border-0" onclick="play('${esc(it.id)}')">${S.playing === it.id ? "❚❚" : "▶"}</button>` : ""}
            <a class="btn btn-md btn-ghost border-[#333]" href="${PROV[it.provider].url}${esc(it.id)}" target="_blank" title="Open on provider">${icon("ext", 16)}</a></div>
          <dl class="text-[13px] divide-y divide-[#2b2b2b] border-y hair">
            ${[["Author", it.author], ["License", it.license], ["Details", meta(it)]].map(([k, v]) => `<div class="flex py-2 gap-4"><dt class="micro opacity-50 w-20 pt-0.5">${k}</dt><dd class="flex-1">${v ? (k === "Details" ? v : esc(v)) : "—"}</dd></div>`).join("")}
          </dl>
          <div><div class="micro opacity-50 mb-2">Tags</div><div class="flex flex-wrap gap-1">${tags(it, 8)}</div></div>
          ${it.variants ? `<div><div class="micro opacity-50 mb-2">Variants (pick one per pack later)</div><div class="flex flex-wrap gap-1">${it.variants.map(v => `<span class="mono text-[11px] px-2 py-1 rounded border hair">${esc(v)}</span>`).join("")}</div></div>` : ""}
          <p class="micro opacity-35">${PROV[it.provider].credit}</p>
        </div></div></div>`;
  return shell(side, main);
}

/* ---------------- render & controls ---------------- */
function render() {
  const ae = document.activeElement, hadQ = ae && ae.name === "q", pos = hadQ ? ae.selectionStart : 0;
  document.getElementById("app").innerHTML = [vA, vB, vC][S.v]();
  for (const p of Object.keys(S.sections)) if (S.sections[p].fresh) S.sections[p].fresh = false;
  if (hadQ) { const q = document.querySelector('input[name="q"]'); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
  document.getElementById("pv").textContent = `${VARIANTS[S.v].key} · ${VARIANTS[S.v].name}`;
  document.getElementById("pstate").textContent = JSON.stringify({
    variant: VARIANTS[S.v].key, type: S.type, query: S.query,
    sections: Object.fromEntries(T().providers.map(p => [p, { status: S.sections[p]?.status, count: S.sections[p]?.items?.length ?? 0 }])),
    selected: S.sel?.id ?? null, saved: [...S.saved], sim: S.sim,
  }, null, 1);
}
function step(d) {
  S.v = (S.v + d + VARIANTS.length) % VARIANTS.length;
  localStorage.setItem("ax-proto-variant", S.v);
  history.replaceState(null, "", "#" + VARIANTS[S.v].key);
  for (const p of Object.keys(S.sections)) if (S.sections[p].status === "ok") S.sections[p].fresh = true;
  if (S.v === 2 && !S.sel) S.sel = firstItem();
  render();
}
function toggleProto() { document.getElementById("pbody").classList.toggle("hidden"); }
document.querySelectorAll("[data-sim]").forEach(cb => cb.addEventListener("change", () => { S.sim[cb.dataset.sim] = cb.checked; runSearch(); }));
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (/^[1-4]$/.test(e.key)) setType(TYPES[+e.key - 1].key);
  else if (S.v === 2 && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const list = allItems(); if (!list.length) return;
    const i = list.findIndex(x => x.id === S.sel?.id);
    S.sel = list[Math.max(0, Math.min(list.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))]; render();
  } else if (S.v === 2 && e.key === "Enter" && S.sel) save(S.sel.id);
});
runSearch();
</script>
</body>
</html>
