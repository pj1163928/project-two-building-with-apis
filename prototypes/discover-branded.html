  html[data-chrome="mono"] { --acc: #FAFAFA; --acc-solid: #FAFAFA; --on-acc: #111111; --acc-soft: #ffffff14; }
  html[data-chrome="blue"] { --acc: #6C8CFF; --acc-solid: #4562E6; --on-acc: #FFFFFF; --acc-soft: #6C8CFF2e; }
  html[data-font="inter"]   { --display: "Inter", sans-serif; --display-track: -0.035em; }
  html[data-font="tight"]   { --display: "Inter Tight", sans-serif; --display-track: -0.03em; }
  html[data-font="jakarta"] { --display: "Plus Jakarta Sans", sans-serif; --display-track: -0.035em; }
  html[data-font="sora"]    { --display: "Sora", sans-serif; --display-track: -0.04em; }
  html[data-font="space"]   { --display: "Space Grotesk", sans-serif; --display-track: -0.03em; }

  [data-theme="axcenity"] {
    color-scheme: dark;
    --color-base-100: #1E1E1E; --color-base-200: #171717; --color-base-300: #2A2A2A; --color-base-content: #E8E8EA;
    --color-primary: #FAFAFA; --color-primary-content: #111111;
    --color-neutral: #2A2A2A; --color-neutral-content: #E8E8EA;
    --color-success: #4CC38A; --color-success-content: #0b1a12;
    --color-warning: #E5B454; --color-warning-content: #111111;
    --color-error: #F07178;   --color-error-content: #ffffff;
    --color-info: #6C8CFF;    --color-info-content: #ffffff;
    --radius-selector: .25rem; --radius-field: .375rem; --radius-box: .5rem;
    --size-selector: .25rem; --size-field: .25rem; --border: 1px; --depth: 0; --noise: 0;
  }
  html, body { font-family: "Inter", ui-sans-serif, system-ui, sans-serif; background: var(--app); color: var(--text); }
  .display { font-family: var(--display); letter-spacing: var(--display-track); }
  .mono  { font-family: "JetBrains Mono", ui-monospace, monospace; }
  .micro { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; }
  .hair { border-color: var(--border); }
  .tc { color: var(--tc); }
  .tc-bg { background: color-mix(in srgb, var(--tc) 14%, transparent); }

  /* ---------- Brand primitives (CSS masks so the logo can be tinted & animated) ---------- */
  .mark, .word { -webkit-mask: var(--mark-url) center / contain no-repeat; mask: var(--mark-url) center / contain no-repeat; background: currentColor; display: inline-block; }
  .word { -webkit-mask-image: var(--word-url); mask-image: var(--word-url); aspect-ratio: 3.2215; }
  .mark { aspect-ratio: 1; }
  /* periodic light sweep across the logo */
  .shine { background: linear-gradient(105deg, var(--strong) 0 42%, #ffffff 48%, #9a9aa2 50%, #ffffff 52%, var(--strong) 58% 100%);
           background-size: 300% 100%; animation: shine 6s ease-in-out infinite; }
  @keyframes shine { 0%, 70% { background-position: 100% 0; } 100% { background-position: 0 0; } }
  /* intro: the mark "cuts in" along its spike (bottom-left to top-right) */
  .mark-in { animation: markIn .9s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes markIn { from { clip-path: polygon(0 100%, 0 100%, 0 100%); opacity: .2; transform: translate(-4px, 4px); }
                      60% { opacity: 1; } to { clip-path: polygon(0 100%, -100% -100%, 200% 0, 200% 200%); transform: none; } }
  .word-in { animation: wordIn 1s .25s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes wordIn { from { clip-path: inset(0 100% 0 0); filter: blur(6px); } to { clip-path: inset(0 0 0 0); filter: none; } }
  /* loader: a light band sweeps through the mark */
  .mark-load { background: linear-gradient(100deg, #3a3a3f 0 35%, var(--strong) 50%, #3a3a3f 65% 100%); background-size: 300% 100%; animation: sweep 1.15s linear infinite; }
  @keyframes sweep { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .mark-pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.92); } }

  /* ---------- Shell ---------- */
  .act { position: relative; color: var(--weak); transition: color .15s; }
  .act:hover { color: var(--strong); }
  .act.on { color: var(--strong); }
  .act.on::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--acc); }
  .btn-acc { background: var(--acc-solid); color: var(--on-acc); border: 0; }
  .btn-acc:hover { filter: brightness(.9); }
  .chip-on { background: var(--acc-soft); color: var(--strong); }

  /* ---------- Cards, tiles, spotlight ---------- */
  .spot { position: relative; isolation: isolate; }
  .spot::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; opacity: 0; transition: opacity .25s;
                 background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), color-mix(in srgb, var(--tc, #fff) 16%, transparent), transparent 70%); }
  .spot:hover::after { opacity: 1; }
  .acard { background: var(--surface); border: 1px solid var(--border); border-radius: .625rem; overflow: hidden;
           transition: transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s, border-color .25s; }
  .acard:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--tc) 55%, var(--border));
           box-shadow: 0 18px 40px -18px color-mix(in srgb, var(--tc) 60%, transparent); }
  .acard .thumb img { transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .acard:hover .thumb img { transform: scale(1.07); }
  .overlay { opacity: 0; transform: translateY(6px); transition: opacity .22s, transform .22s; }
  .acard:hover .overlay, .acard:focus-within .overlay { opacity: 1; transform: none; }
  .tile { background: var(--panel); border: 1px solid var(--border); border-radius: .625rem; transition: border-color .2s, background .2s, transform .2s; }
  .tile:hover { border-color: var(--border-strong); transform: translateY(-2px); }
  .tile.on { border-color: var(--tc); background: color-mix(in srgb, var(--tc) 9%, var(--panel)); }
  .tile .bar { height: 2px; background: var(--tc); transform-origin: left; transform: scaleX(0); transition: transform .45s cubic-bezier(.2,.8,.2,1); }
  .tile.on .bar { transform: scaleX(1); }

  .rise { animation: rise .55s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
  .fade { animation: fade .35s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .wave rect { transform-origin: center; }
  .playing .wave rect { animation: eq .9s ease-in-out infinite alternate; }
  @keyframes eq { from { transform: scaleY(.35); } to { transform: scaleY(1); } }

  .cmd { background: var(--surface); border: 1px solid var(--border); box-shadow: 0 30px 70px -30px #000; transition: border-color .2s, box-shadow .2s; }
  .cmd:focus-within { border-color: var(--border-strong); box-shadow: 0 0 0 4px #ffffff0a, 0 30px 70px -30px #000; }
  input[name="q"] { outline: none !important; border: 0; box-shadow: none; }
  .grid-bg { background-image: radial-gradient(#ffffff0b 1px, transparent 1px); background-size: 20px 20px; }

  /* Right-edge scroll ruler + section index */
  .ruler { background-image: repeating-linear-gradient(to bottom, #ffffff22 0 1px, transparent 1px 12px); }
  .ruler .major { position: absolute; right: 0; width: 12px; height: 1px; background: #ffffff55; }
  .sec-link { color: var(--muted); transition: color .2s; }
  .sec-link.on { color: var(--strong); }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border: 3px solid var(--panel); border-radius: 8px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  #proto { font-family: system-ui, sans-serif; }
</style>

const S = {
  type: "textures", query: DATA.textures.q, sections: {}, saved: new Set(), saving: new Set(),
  sim: { failPH: false, failOV: false, emptyACG: false, slow: false },
  playing: null, token: 0, intro: true,

};
const T = () => TYPES.find(t => t.key === S.type);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const mb = b => b ? (b > 1e9 ? (b / 1e9).toFixed(2) + " GB" : (b / 1e6).toFixed(1) + " MB") : "";
const mss = ms => ms ? `${Math.floor(ms / 60000)}:${String(Math.round(ms / 1000) % 60).padStart(2, "0")}` : "?";

/* ---------- search simulation: one request per provider, like the HTMX sections ---------- */
function runSearch() {
  const tok = ++S.token;
  for (const p of T().providers) {
    S.sections[p] = { status: "loading", items: [] };
    setTimeout(() => { if (tok !== S.token) return; S.sections[p] = resolve(p); render(); }, PROV[p].delay * (S.sim.slow ? 3 : 1));
  }
  render();
}
function resolve(p) {
  if (p === "polyhaven" && S.sim.failPH) return { status: "error", msg: "Could not connect to Poly Haven. Check your internet connection, or try again in a minute." };
  if (p === "openverse" && S.sim.failOV) return { status: "error", msg: "Openverse Audio timed out after 10 s. New searches can be slow; try again shortly or use a different phrase." };
  const block = DATA[S.type];
  let items = (block[p] || []).map(it => ({ ...it, provider: p, kind: T().kind }));
  if (p === "ambientcg" && S.sim.emptyACG) items = [];
  const q = S.query.trim().toLowerCase();
  if (q && q !== block.q) { const w = q.split(/\s+/); items = items.filter(it => w.some(x => (it.name + " " + it.tags.join(" ")).toLowerCase().includes(x))); }
  return items.length ? { status: "ok", items, fresh: true } : { status: "empty", items: [] };
}
function save(id) { if (S.saved.has(id) || S.saving.has(id)) return; S.saving.add(id); render();
  setTimeout(() => { S.saving.delete(id); S.saved.add(id); render(); }, 650); }
function setType(k) { if (k === S.type) return; S.type = k; S.query = DATA[k].q; runSearch(); }
function submit(e) { e.preventDefault(); S.query = e.target.q.value; runSearch(); }
function retry(p) { S.sections[p] = { status: "loading", items: [] }; render(); setTimeout(() => { S.sections[p] = resolve(p); render(); }, PROV[p].delay); }
function play(id) { S.playing = S.playing === id ? null : id; render(); }
window.imgFail = img => img.replaceWith(Object.assign(document.createElement("div"), { className: "w-full h-full grid place-items-center tc-bg tc", innerHTML: icon(img.dataset.kind, 36) }));

function wave(id, w = 120, h = 40, bars = 28) {
  let x = 0; for (const ch of id) x = (x * 31 + ch.charCodeAt(0)) >>> 0;
  let out = ""; const bw = w / bars;
  for (let i = 0; i < bars; i++) { x = (x * 1103515245 + 12345) >>> 0;
    const bh = Math.max(3, ((x >>> 16) % 100) / 100 * h * (0.4 + 0.6 * Math.sin(Math.PI * i / bars)));
    out += `<rect x="${i * bw + 1}" y="${(h - bh) / 2}" width="${bw - 2}" height="${bh}" rx="1" fill="currentColor" style="animation-delay:${(i % 7) * 70}ms"/>`; }
  return `<svg class="wave" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" width="100%" height="100%">${out}</svg>`;
}
function thumb(it) { return `<img src="${esc(it.thumb)}" alt="" loading="lazy" data-kind="${it.kind}" onerror="imgFail(this)" class="w-full h-full object-cover">`; }
function meta(it) {
  if (it.kind === "sound") return `${mss(it.duration)} · ${esc(it.filetype || "?")} · by ${esc(it.author || "unknown")}`;
  if (it.provider === "polyhaven") return `max ${esc(it.maxres || "?")} · ${esc(it.author || "")}`;
  return `${(it.variants || []).length}+ downloads · from ${mb(it.size)}`;
}
function tags(it, n = 3) { return it.tags.filter(t => !/^\d+$/.test(t)).slice(0, n).map(t => `<span class="mono text-[10.5px] px-1.5 py-0.5 rounded bg-black/50 text-[#c8c8cc] backdrop-blur">${esc(t)}</span>`).join(""); }
function typeBadge(it) { return `<span class="micro px-1.5 py-0.5 rounded tc bg-black/75 backdrop-blur border border-white/10">${it.kind}</span>`; }
function savedBadge() { return `<span class="micro flex items-center gap-1.5 px-1.5 py-1 rounded bg-black/75 backdrop-blur border border-white/10 text-white fade"><i class="mark w-3"></i>In library</span>`; }
function saveBtn(it, cls = "btn-sm w-full") {
  if (S.saved.has(it.id)) return `<button class="btn ${cls} bg-[#4CC38A1f] text-[#4CC38A] border-0 pointer-events-none"><i class="mark w-3.5"></i>Saved to library</button>`;
  if (S.saving.has(it.id)) return `<button class="btn ${cls} bg-[#2A2A2A] border-0"><i class="mark mark-load w-4"></i>Saving…</button>`;
  return `<button class="btn ${cls} btn-acc" onclick="event.stopPropagation(); save('${esc(it.id)}')">+ Save to library</button>`;
}
function status(p) {
  const s = S.sections[p]; if (!s) return "";
  if (s.status === "loading") return `<span class="flex items-center gap-2 micro text-[var(--weak)]"><i class="mark mark-load w-3.5"></i>Searching</span>`;
  if (s.status === "error") return `<span class="micro text-error">Unavailable</span>`;
  if (s.status === "empty") return `<span class="micro text-[var(--muted)]">0 results</span>`;
  return `<span class="micro text-[var(--weak)]">${s.items.length} results</span>`;
}

/* ---------- page ---------- */
function shelf(p, n) {
  const t = T(), s = S.sections[p];
  const cols = t.kind === "sound" ? "grid-cols-1 md:grid-cols-2 xl:grid-cols-3" : "grid-cols-2 md:grid-cols-3 xl:grid-cols-5 2xl:grid-cols-6";
  let body;
  if (!s || s.status === "loading") body = `<div class="relative"><div class="grid gap-4 ${cols}">${Array.from({ length: t.kind === "sound" ? 3 : 6 }, (_, i) =>
      `<div class="rounded-[.625rem] overflow-hidden" style="opacity:${1 - i * .1};border:1px solid var(--border);background:var(--surface)"><div class="skeleton ${t.kind === "sound" ? "h-28" : "aspect-[4/3]"} rounded-none" style="background:#222;border:0"></div><div class="p-3 space-y-2"><div class="skeleton h-3 w-3/4" style="background:#2a2a2a"></div><div class="skeleton h-3 w-1/2" style="background:#2a2a2a"></div></div></div>`).join("")}</div>
      <div class="absolute inset-0 grid place-items-center pointer-events-none"><div class="flex flex-col items-center gap-3 px-5 py-4 rounded-xl bg-[#171717e6] border hair backdrop-blur">
        <i class="mark mark-load w-10"></i><span class="micro text-[var(--secondary)]">Searching ${PROV[p].name}</span></div></div></div>`;
  else if (s.status === "error") body = `<div role="alert" class="fade flex items-start gap-4 p-5 rounded-xl border border-[#F0717855] bg-[#F071780f]">
      <svg class="text-error shrink-0 mt-0.5" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
      <div class="flex-1"><div class="font-semibold text-white">${PROV[p].name} is unavailable</div><div class="text-sm text-[var(--secondary)] mt-0.5">${esc(s.msg)}</div>
      <div class="text-xs text-[var(--weak)] mt-2">Your library is unaffected: saved assets are stored locally.</div></div>
      <button class="btn btn-sm bg-[#2A2A2A] border-0 hover:bg-[#323232]" onclick="retry('${p}')">Retry</button></div>`;
  else if (s.status === "empty") body = `<div class="fade relative overflow-hidden rounded-xl border border-dashed hair p-10 text-center">
      <i class="mark absolute -right-6 -bottom-10 w-48 text-white opacity-[.03]"></i>
      <i class="mark w-8 text-[var(--muted)]"></i>
      <div class="mt-3 text-[var(--secondary)]">No ${PROV[p].name} matches for '<span class="mono text-white">${esc(S.query)}</span>'.</div>
      <div class="text-sm text-[var(--weak)] mt-1">Try a different or broader phrase.</div></div>`;
  else body = `<div class="grid gap-4 ${cols}">${s.items.map((it, i) => (it.kind === "sound" ? soundCard : card)(it, i, s.fresh)).join("")}</div>`;
  return `<section id="sec-${p}" data-sec="${PROV[p].name}" class="space-y-4 scroll-mt-6">
    <div class="flex items-center gap-4"><span class="micro text-[var(--muted)]">0${n + 1}</span><span class="micro text-white">${PROV[p].name}</span>
      <div class="flex-1 h-px bg-[var(--border)]"></div>${status(p)}<span class="micro text-[var(--muted)] hidden md:inline">${PROV[p].credit}</span></div>
    ${body}</section>`;
}
function card(it, i, fresh) {
  return `<article class="acard spot group ${fresh ? "rise" : ""}" style="animation-delay:${i * 55}ms">
    <div class="thumb aspect-[4/3] relative overflow-hidden bg-[#151515]">${thumb(it)}
      <div class="absolute top-2 left-2">${typeBadge(it)}</div>
      ${S.saved.has(it.id) ? `<div class="absolute top-2 right-2">${savedBadge()}</div>` : ""}
      <div class="overlay absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent flex flex-col justify-end p-3 gap-2">
        <div class="flex flex-wrap gap-1">${tags(it)}</div>${saveBtn(it)}</div>
    </div>
    <div class="px-3 py-2.5"><h3 class="text-[13.5px] font-semibold text-white truncate">${esc(it.name)}</h3>
      <div class="flex justify-between gap-2"><p class="text-[11.5px] text-[var(--weak)] truncate">${meta(it)}</p><span class="micro text-[var(--muted)] shrink-0">${esc(it.license)}</span></div></div>
  </article>`;
}
function soundCard(it, i, fresh) {
  const on = S.playing === it.id;
  return `<article class="acard spot p-4 space-y-3 ${fresh ? "rise" : ""}" style="animation-delay:${i * 55}ms">
    <div class="flex items-center gap-3"><button class="btn btn-circle tc-bg tc border-0" onclick="play('${esc(it.id)}')">${on ? "❚❚" : "▶"}</button>
      <div class="min-w-0 flex-1"><h3 class="text-[14px] font-semibold text-white truncate">${esc(it.name)}</h3><p class="text-[11.5px] text-[var(--weak)] truncate">${meta(it)}</p></div>
      ${S.saved.has(it.id) ? savedBadge() : ""}</div>
    <div class="h-14 tc rounded-lg tc-bg p-2 ${on ? "playing" : ""}">${wave(it.id, 240, 40, 48)}</div>
    <div class="flex items-center justify-between"><div class="flex gap-1">${tags(it, 2)}</div><span class="micro text-[var(--muted)]">${esc(it.license)}</span></div>
    ${saveBtn(it)}</article>`;
}

function render() {
  const t = T();
  const ae = document.activeElement, hadQ = ae && ae.name === "q", pos = hadQ ? ae.selectionStart : 0;
  const prevScroll = document.getElementById("scroller")?.scrollTop ?? 0;
  const intro = S.intro;
  document.documentElement.dataset.font = S.font;
  document.documentElement.dataset.chrome = S.chrome;

  document.getElementById("app").innerHTML = `
  <div class="h-screen flex flex-col" style="--tc:${t.c}">
    <!-- Title bar: wordmark, animated in, with a periodic light sweep -->
    <header class="h-10 shrink-0 flex items-center gap-3 px-3 border-b hair bg-[var(--app)]">
      <i class="word shine h-[18px] ${intro ? "word-in" : ""}"></i>
      <span class="w-px h-4 bg-[var(--border-strong)]"></span>
      <span class="micro text-[var(--secondary)]">Toolbox</span>
      <span class="micro text-[var(--muted)] ml-5 hidden lg:inline">discover <span class="mx-1">/</span> ${t.key} <span class="mx-1">/</span> <span class="tc">'${esc(S.query)}'</span></span>
      <div class="ml-auto flex items-center gap-4">
        <span class="micro text-[var(--weak)] hidden md:inline">Docs</span><span class="micro text-[var(--weak)] hidden md:inline">API</span>
        <span class="micro bg-white text-black px-2 py-1">demo_alice</span>
      </div>
    </header>
    <div class="flex flex-1 min-h-0">
      <!-- Activity bar: the app icon tile is "Home" -->
      <nav class="w-14 shrink-0 flex flex-col items-center gap-1 py-2 bg-[var(--app)] border-r hair">
        <a title="Home" class="w-9 h-9 mb-2 rounded-[9px] overflow-hidden ring-1 ring-white/10 hover:ring-white/30 transition ${intro ? "mark-in" : ""}"><img src="${TILE}" class="w-full h-full"></a>
        ${[["search", "Discover", true], ["library", "Library"], ["pack", "Packs"]].map(([k, l, on]) =>
          `<button title="${l}" class="act ${on ? "on" : ""} w-14 h-11 grid place-items-center">${icon(k, 21)}</button>`).join("")}
        <div class="flex-1"></div>
        <button title="Account" class="act w-14 h-11 grid place-items-center">${icon("user", 21)}</button>
        <button title="Settings" class="act w-14 h-11 grid place-items-center">${icon("gear", 20)}</button>
      </nav>

      <main class="flex-1 min-w-0 relative bg-[var(--panel)]">
        <div id="scroller" class="absolute inset-0 overflow-auto grid-bg">
          <!-- Watermark: giant mark drifting behind the content (parallax) -->
          <i id="wm" class="mark pointer-events-none absolute -right-40 top-4 w-[720px] text-white opacity-[.028]" style="transform:translateY(calc(var(--sy,0) * .35px)) rotate(-6deg)"></i>
          <div class="relative max-w-[1500px] mx-auto pl-8 pr-16 py-8 space-y-10">
            <div class="flex items-end justify-between gap-6" id="sec-top" data-sec="Discover">
              <div class="space-y-2">
                <div class="micro tc flex items-center gap-2"><i class="mark w-3 ${intro ? "mark-in" : ""}"></i>Discover · ${t.label}</div>
                <h1 class="display text-4xl md:text-5xl font-extrabold text-white leading-[1.02]">Find assets for<br>your next pack.</h1>
                <p class="text-[var(--secondary)] max-w-xl">Search free CC0 and Creative Commons libraries, save what fits, and build packs your Axcenity projects can import.</p>
              </div>
            </div>

            <form onsubmit="submit(event)" class="cmd rounded-xl flex items-center gap-3 px-4 h-14">
              <span class="text-[var(--weak)]">${icon("search", 20)}</span>
              <input name="q" value="${esc(S.query)}" autocomplete="off" placeholder="Search ${t.label.toLowerCase()}…" class="flex-1 bg-transparent text-lg text-white placeholder:text-[var(--muted)]">
              <span class="micro text-[var(--muted)] hidden md:inline">${t.providers.map(p => PROV[p].name).join(" + ")}</span>
              <kbd class="kbd kbd-sm bg-[var(--control)] border-[var(--border-strong)]">/</kbd>
            </form>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">${TYPES.map((x, i) => `
              <button onclick="setType('${x.key}')" style="--tc:${x.c}" class="tile spot ${x.key === S.type ? "on" : ""} text-left overflow-hidden">
                <div class="p-4"><div class="flex items-center justify-between"><span class="tc">${icon(x.kind, 22)}</span><span class="micro text-[var(--muted)]">0${i + 1}</span></div>
                  <div class="display mt-4 text-lg font-bold text-white">${x.label}</div>
                  <div class="text-[12.5px] text-[var(--weak)]">${x.blurb}</div>
                  <div class="micro text-[var(--muted)] mt-2">${x.providers.map(p => PROV[p].name).join(" + ")}</div></div>
                <div class="bar"></div></button>`).join("")}</div>

            ${t.providers.map((p, i) => shelf(p, i)).join("")}

            <!-- Featured footer: big wordmark, cropped, ArtCraft-style closer in Axcenity's own logo -->
            <footer class="pt-16 pb-6 relative overflow-hidden">
              <div class="flex items-center justify-between micro text-[var(--muted)] mb-6"><span>Built for Axcenity Engine</span><span>CIDM 3312 · 2026</span></div>
              <i class="word w-full text-white opacity-[.06] block"></i>
            </footer>
          </div>
        </div>
        <!-- Right-edge scroll ruler + section index -->
        <div class="absolute right-0 top-0 bottom-0 w-6 pointer-events-none">
          <div class="ruler absolute right-0 top-3 bottom-3 w-2"></div>
          <div id="rmark" class="absolute right-0 w-5 h-[2px] bg-white transition-[top] duration-150" style="top:12px"></div>
        </div>
        <div id="secidx" class="absolute right-9 bottom-5 text-right space-y-0.5 pointer-events-auto"></div>
      </main>
    </div>
    <footer class="h-6 shrink-0 flex items-center gap-4 px-3 text-[11.5px] bg-[var(--app)] border-t hair text-[var(--secondary)]">
      <span class="flex items-center gap-1.5 text-white"><i class="mark w-3"></i>Toolbox</span>
      ${t.providers.map(p => { const st = S.sections[p]?.status; const col = { ok: "#4CC38A", loading: "#E5B454", error: "#F07178", empty: "#8E8E96" }[st] || "#8E8E96";
        return `<span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full" style="background:${col};box-shadow:0 0 6px ${col}"></span>${PROV[p].name}</span>`; }).join("")}
      <span class="text-[var(--muted)]">Openverse · 200 req/day</span>
      <span class="ml-auto">Library · <b class="text-white">${S.saved.size}</b> saved</span>
    </footer>
  </div>`;

  for (const p of Object.keys(S.sections)) if (S.sections[p].fresh) S.sections[p].fresh = false;
  S.intro = false;
  const sc = document.getElementById("scroller");
  sc.scrollTop = prevScroll;
  sc.addEventListener("scroll", onScroll, { passive: true });
  sc.addEventListener("pointermove", onSpot, { passive: true });
  onScroll();
  if (hadQ) { const q = document.querySelector('input[name="q"]'); q.focus(); q.setSelectionRange(pos, pos); }
  renderProto();
}

function onScroll() {
  const sc = document.getElementById("scroller"); if (!sc) return;
  sc.style.setProperty("--sy", sc.scrollTop);
  const max = Math.max(1, sc.scrollHeight - sc.clientHeight);
  document.getElementById("rmark").style.top = `${12 + (sc.clientHeight - 26) * (sc.scrollTop / max)}px`;
  const secs = [...sc.querySelectorAll("[data-sec]")];
  let cur = secs[0];
  for (const s of secs) if (s.offsetTop - sc.scrollTop < sc.clientHeight * .45) cur = s;
  document.getElementById("secidx").innerHTML = secs.map(s =>
    `<a class="sec-link ${s === cur ? "on" : ""} micro block cursor-pointer" onclick="document.getElementById('${s.id}').scrollIntoView({behavior:'smooth'})">${s.dataset.sec}</a>`).join("");
}
function onSpot(e) {
  const el = e.target.closest(".spot"); if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty("--mx", `${e.clientX - r.left}px`); el.style.setProperty("--my", `${e.clientY - r.top}px`);
}
function replayIntro() { S.intro = true; render(); }
function renderProto() {
  document.getElementById("fontBtns").innerHTML = FONTS.map(([k, l]) => `<button onclick="S.font='${k}';localStorage.setItem('ax-font','${k}');render()" class="px-2 py-0.5 rounded ${S.font === k ? "bg-black text-yellow-200" : "bg-black/10 hover:bg-black/20"}">${l}</button>`).join("");
  document.getElementById("chromeBtns").innerHTML = CHROMES.map(([k, l]) => `<button onclick="S.chrome='${k}';localStorage.setItem('ax-chrome','${k}');render()" class="px-2 py-0.5 rounded ${S.chrome === k ? "bg-black text-yellow-200" : "bg-black/10 hover:bg-black/20"}">${l}</button>`).join("");
  document.getElementById("pstate").textContent = JSON.stringify({ type: S.type, query: S.query, font: S.font, chrome: S.chrome,
    sections: Object.fromEntries(T().providers.map(p => [p, S.sections[p]?.status])), saved: [...S.saved], sim: S.sim }, null, 1);
}
document.querySelectorAll("[data-sim]").forEach(cb => cb.addEventListener("change", () => { S.sim[cb.dataset.sim] = cb.checked; runSearch(); }));
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "/") { e.preventDefault(); document.querySelector('input[name="q"]').focus(); }
  else if (/^[1-4]$/.test(e.key)) setType(TYPES[+e.key - 1].key);
});
runSearch();
</script>
</body>
</html>
