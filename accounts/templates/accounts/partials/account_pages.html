{# The Account pages' side panel. Pass current="profile", "settings" or "token". #}
<ul class="flex flex-col gap-1 mt-3 pt-1 border-t border-line" aria-label="Account pages">
  <li><a class="panel-row" href="{% url 'accounts:profile' %}"{% if current == "profile" %} aria-current="page"{% endif %}><span class="panel-row-icon" aria-hidden="true">{% include "partials/icon.html" with name="user" size=16 %}</span><span class="truncate">Profile</span></a></li>
  <li><a class="panel-row" href="{% url 'accounts:settings' %}"{% if current == "settings" %} aria-current="page"{% endif %}><span class="panel-row-icon" aria-hidden="true">{% include "partials/icon.html" with name="gear" size=16 %}</span><span class="truncate">Settings</span></a></li>
  <li><a class="panel-row" href="{% url 'accounts:token' %}"{% if current == "token" %} aria-current="page"{% endif %}><span class="panel-row-icon" aria-hidden="true">{% include "partials/icon.html" with name="key" size=16 %}</span><span class="truncate">API token</span></a></li>
</ul>
