{# A save that failed: Save's corner square becomes Try again, which posts the same save #}
{# and swaps the slot again, and the ProviderError's friendly message drops below the   #}
{# corner row. Nothing was saved.                                                        #}
<form class="save-slot save-error" hx-post="{% url 'catalog:save' %}" hx-target="this" hx-swap="outerHTML" hx-disabled-elt="find button">
  <input type="hidden" name="provider" value="{{ provider }}">
  <input type="hidden" name="external_id" value="{{ external_id }}">
  <button type="submit" class="card-action save-button is-error" aria-label="Try saving again">{% include "partials/icon.html" with name="alert" size=15 %}<span class="card-tip" aria-hidden="true"><span class="save-label">Try again</span><span class="save-busy">Saving…</span></span></button>
  <p class="save-error-text" role="alert">{% include "partials/icon.html" with name="alert" size=13 %}<span>{{ error }}</span></p>
</form>
