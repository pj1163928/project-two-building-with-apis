{# The Attribution center's side panel: its three pages (the guide for everyone; a     #}
{# member's pack and asset attribution), the current one marked.                    #}
<nav id="attribution-nav" class="mt-3 border-t border-line" aria-label="Attribution center">
  <div class="h-11 flex items-center pl-5 pr-3"><span class="micro text-fg-secondary">Attribution center</span></div>
  <ul class="flex flex-col gap-1">
    <li><a class="panel-row" href="{% url 'packs:attribution' %}"{% if attribution_page == "guide" %} aria-current="page"{% endif %}><span class="truncate">License guide</span></a></li>
    {% if user.is_authenticated %}
      <li><a class="panel-row" href="{% url 'packs:attribution_packs' %}"{% if attribution_page == "packs" %} aria-current="page"{% endif %}><span class="truncate">Pack attribution</span></a></li>
      <li><a class="panel-row" href="{% url 'packs:attribution_assets' %}"{% if attribution_page == "assets" %} aria-current="page"{% endif %}><span class="truncate">Asset attribution</span></a></li>
    {% endif %}
  </ul>
</nav>
